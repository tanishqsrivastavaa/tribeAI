[project]
name = "tribe"
version = "0.1.0"
description = "A minimal personal agent harness"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.3.0",
    "typer>=0.15",
]

[project.scripts]
tribe = "tribe.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
