[project]
name = "tribeai"
version = "0.1.0"
description = "A minimal personal agent harness"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tanishq Srivastava" }]
dependencies = [
    "anthropic>=1.3.0",
    "openai>=3.8.0",
    "textual>=0.60",
    "typer>=0.15",
]

[project.urls]
Homepage = "https://github.com/tanishqsrivastavaa/tribeAI"
Issues = "https://github.com/tanishqsrivastavaa/tribeAI/issues"

[project.scripts]
tribe = "tribe.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
